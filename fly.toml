# Fly.io configuration for the order-flask API.
# Secrets (MONGODB_URI) are set with `fly secrets set`, never in this file.

app = "order-flask"
primary_region = "ord"

[build]

[env]
  APP_CONFIG = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
